name: Refresh listings and deploy

on:
  schedule:
    - cron: "0 5 * * *"   # daily, 05:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["frontend/**", "infra/**", "scraper/**", "requirements.txt", ".github/workflows/refresh-and-deploy.yml"]

# One run at a time: two overlapping runs would race on the S3 data files.
concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

permissions:
  id-token: write   # GitHub OIDC -> AWS, no stored access keys
  contents: read

env:
  AWS_REGION: us-east-1
  BUCKET: housefinder-frontend-854656252703
  # Scrape on the schedule / manual runs, or on a push whose commit message
  # contains "[refresh]". Any other push just redeploys with the data as is.
  DO_SCRAPE: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]') }}

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::854656252703:role/housefinder-github-deploy
          role-duration-seconds: 21600   # default is 1h; these runs take 2h+
          aws-region: ${{ env.AWS_REGION }}

      # The data files aren't in git; the live copy in S3 is the source of truth.
      - name: Pull current data from S3
        run: |
          mkdir -p frontend/public/data
          aws s3 cp "s3://$BUCKET/data/" frontend/public/data/ --recursive
          # A previous run that died part-way saved its progress here (see
          # "Save checkpoint" below); it's a superset of data/ for the same
          # listings, so overlay it. Cleared after every successful deploy.
          # Only for scraping runs: a code-only push must deploy the data as it
          # is, not a half-finished checkpoint.
          if [ "$DO_SCRAPE" = "true" ] && aws s3 ls "s3://$BUCKET/cache/" > /dev/null 2>&1; then
            echo "resuming from checkpoint"
            aws s3 cp "s3://$BUCKET/cache/" frontend/public/data/ --recursive
          fi

      - uses: actions/setup-python@v5
        if: env.DO_SCRAPE == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scraper dependencies
        if: env.DO_SCRAPE == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # Homeflow agencies time out from GitHub's IPs; the dev host scrapes them
      # on cron and uploads the raw result here (see scraper/refresh.py).
      - name: Fetch pre-scraped Homeflow results
        if: env.DO_SCRAPE == 'true'
        run: aws s3 cp "s3://$BUCKET/inbox/homeflow.json" /tmp/homeflow.json || echo "no inbox file"

      # Permanent per-listing history (first/last seen, price + status
      # changes, disappearances) for analytics — lives outside the site data
      # so the 90-day pruning of listings.json never erases it.
      - name: Pull listing history
        if: env.DO_SCRAPE == 'true'
        run: |
          mkdir -p analytics
          aws s3 cp "s3://$BUCKET/analytics/history.json" analytics/history.json || echo "no history yet"

      - name: Re-scrape agencies and merge into listings.json
        if: env.DO_SCRAPE == 'true'
        run: python -m scraper.refresh --listings frontend/public/data/listings.json --history analytics/history.json --per-agency 800 --max-pages 90 --inject /tmp/homeflow.json

      # Right away, not at the end: history must survive a failed embed/deploy.
      - name: Save listing history
        if: env.DO_SCRAPE == 'true'
        run: aws s3 cp analytics/history.json "s3://$BUCKET/analytics/history.json"

      # Save the merged listings right away: if embedding dies, the next run
      # won't have to redo the scrape.
      - name: Checkpoint listings
        if: env.DO_SCRAPE == 'true'
        run: aws s3 cp frontend/public/data/listings.json "s3://$BUCKET/cache/listings.json"

      # embeddings.py writes embeddings.json every few listings; a background
      # loop copies it to S3 so even a hard kill loses at most a few minutes.
      - name: Embed new listings (existing ones are reused)
        if: env.DO_SCRAPE == 'true'
        timeout-minutes: 200   # leaves time for the always() checkpoint step below
        run: |
          ( while true; do sleep 300; aws s3 cp frontend/public/data/embeddings.json "s3://$BUCKET/cache/embeddings.json" --quiet || true; done ) &
          python -m scraper.embeddings --incremental --max-minutes 165 --in frontend/public/data/listings.json --out frontend/public/data/embeddings.json

      - name: Save checkpoint
        if: always() && env.DO_SCRAPE == 'true'
        run: |
          for f in listings embeddings; do
            [ -f "frontend/public/data/$f.json" ] && aws s3 cp "frontend/public/data/$f.json" "s3://$BUCKET/cache/$f.json" --quiet || true
          done

      - name: Geocode any new postcode areas
        if: env.DO_SCRAPE == 'true'
        run: python -m scraper.geocode_areas

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # BucketDeployment uploads frontend/dist (which now contains the
      # refreshed data/) and invalidates CloudFront.
      - name: Deploy
        working-directory: infra
        run: |
          npm ci
          NODE_OPTIONS="--max-old-space-size=3000" TS_NODE_TRANSPILE_ONLY=true npx cdk deploy HousefinderFrontend --require-approval never

      # Only reached if everything above succeeded: the deployed data/ now
      # contains this run's work, so the checkpoint is obsolete (and would
      # otherwise overlay newer data next time).
      - name: Clear checkpoint
        if: env.DO_SCRAPE == 'true'
        run: aws s3 rm "s3://$BUCKET/cache/" --recursive
