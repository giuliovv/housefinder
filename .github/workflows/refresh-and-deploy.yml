name: Refresh listings and deploy

on:
  schedule:
    - cron: "23 5 * * *"   # daily, 05:23 UTC (06:23 London in summer) — not on the hour: GitHub delays/drops :00 crons
    # GitHub silently dropped a daily slot once (2026-10-09), so there are two later fallbacks; they do
    # nothing unless the day's scrape hasn't happened (see the `check` job).
    - cron: "47 11 * * *"
    - cron: "13 17 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["frontend/**", "infra/**", "scraper/**", "requirements.txt", ".github/workflows/refresh-and-deploy.yml"]

# A push that touches frontend/, infra/ or scraper/ deploys; add [refresh] to its
# commit message to also scrape (an empty commit matches no path, so it won't run).
# One run at a time: two overlapping runs would race on the S3 data files.
concurrency:
  group: refresh-and-deploy
  cancel-in-progress: false

permissions:
  id-token: write   # GitHub OIDC -> AWS, no stored access keys
  contents: read

env:
  AWS_REGION: us-east-1
  BUCKET: housefinder-frontend-854656252703
  # Scrape on the schedule / manual runs, or on a push whose commit message
  # contains "[refresh]". Any other push just redeploys with the data as is.
  DO_SCRAPE: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]') }}

jobs:
  # Scheduled runs only proceed if today's scrape hasn't been recorded yet, so the fallback crons cost a few seconds.
  check:
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::854656252703:role/housefinder-github-deploy
          aws-region: ${{ env.AWS_REGION }}
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(date -u +%F)
          aws s3 cp "s3://$BUCKET/analytics/history.json" /tmp/history.json || { echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if python3 -c "import json,sys; h=json.load(open('/tmp/history.json')); sys.exit(0 if h.get('runs',{}).get('$today') else 1)"; then
            echo "already scraped $today; nothing to do"; echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  refresh-and-deploy:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::854656252703:role/housefinder-github-deploy
          role-duration-seconds: 21600   # default is 1h; these runs take 2h+
          aws-region: ${{ env.AWS_REGION }}

      # The data files aren't in git; the live copy in S3 is the source of truth.
      # embeddings.json (every photo's full vectors, ~150MB) is the *working*
      # store, kept under work/ and never shipped to the site; the site gets the
      # compact ranking.bin / ranking-index.json / deck.json that
      # scraper/export_embeddings.py builds from it.
      - name: Pull current data from S3
        run: |
          mkdir -p frontend/public/data work
          aws s3 cp "s3://$BUCKET/data/" frontend/public/data/ --recursive --exclude "embeddings.json"
          aws s3 cp "s3://$BUCKET/work/embeddings.json" work/embeddings.json \
            || aws s3 cp "s3://$BUCKET/data/embeddings.json" work/embeddings.json \
            || echo "no embeddings yet"
          # A previous run that died part-way saved its progress under cache/ (see
          # "Save checkpoint" below); it's a superset of the above for the same
          # listings, so overlay it. Only for scraping runs: a code-only push must
          # deploy the data as it is, not a half-finished checkpoint. Cleared after
          # every successful deploy.
          if [ "$DO_SCRAPE" = "true" ] && aws s3 ls "s3://$BUCKET/cache/" > /dev/null 2>&1; then
            echo "resuming from checkpoint"
            aws s3 cp "s3://$BUCKET/cache/listings.json" frontend/public/data/listings.json || true
            aws s3 cp "s3://$BUCKET/cache/embeddings.json" work/embeddings.json || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scraper dependencies
        if: env.DO_SCRAPE == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # Code-only pushes still rebuild the compact site embeddings (the deploy
      # replaces the whole site, so they must be part of every build).
      - name: Install export dependencies
        if: env.DO_SCRAPE != 'true'
        run: pip install ijson numpy requests

      # Homeflow agencies time out from GitHub's IPs; the dev host scrapes them
      # on cron and uploads the raw result here (see scraper/refresh.py).
      - name: Fetch pre-scraped Homeflow results
        if: env.DO_SCRAPE == 'true'
        run: aws s3 cp "s3://$BUCKET/inbox/homeflow.json" /tmp/homeflow.json || echo "no inbox file"

      # Permanent per-listing history (first/last seen, price + status
      # changes, disappearances) for analytics — lives outside the site data
      # so the 90-day pruning of listings.json never erases it.
      - name: Pull listing history
        if: env.DO_SCRAPE == 'true'
        run: |
          mkdir -p analytics
          aws s3 cp "s3://$BUCKET/analytics/history.json" analytics/history.json || echo "no history yet"

      - name: Re-scrape agencies and merge into listings.json
        if: env.DO_SCRAPE == 'true'
        run: python -m scraper.refresh --listings frontend/public/data/listings.json --history analytics/history.json --per-agency 800 --max-pages 90 --max-minutes 100 --inject /tmp/homeflow.json

      # Right away, not at the end: history must survive a failed embed/deploy.
      - name: Save listing history
        if: env.DO_SCRAPE == 'true'
        run: aws s3 cp analytics/history.json "s3://$BUCKET/analytics/history.json"

      # Save the merged listings right away: if embedding dies, the next run
      # won't have to redo the scrape.
      - name: Checkpoint listings
        if: env.DO_SCRAPE == 'true'
        run: aws s3 cp frontend/public/data/listings.json "s3://$BUCKET/cache/listings.json"

      # embeddings.py writes embeddings.json every few listings; a background
      # loop copies it to S3 so even a hard kill loses at most a few minutes.
      - name: Embed new listings (existing ones are reused)
        if: env.DO_SCRAPE == 'true'
        timeout-minutes: 200   # leaves time for the always() checkpoint step below
        run: |
          ( while true; do sleep 300; aws s3 cp work/embeddings.json "s3://$BUCKET/cache/embeddings.json" --quiet || true; done ) &
          python -m scraper.embeddings --incremental --max-minutes 165 --in frontend/public/data/listings.json --out work/embeddings.json

      - name: Save checkpoint
        if: always() && env.DO_SCRAPE == 'true'
        run: |
          [ -f frontend/public/data/listings.json ] && aws s3 cp frontend/public/data/listings.json "s3://$BUCKET/cache/listings.json" --quiet || true
          [ -f work/embeddings.json ] && aws s3 cp work/embeddings.json "s3://$BUCKET/cache/embeddings.json" --quiet || true

      # The durable copy of the working embeddings (checkpoints under cache/ are
      # cleared after a deploy); saved before deploying so a failed deploy can't lose it.
      - name: Save working embeddings
        if: always() && env.DO_SCRAPE == 'true'
        run: |
          [ -f work/embeddings.json ] && aws s3 cp work/embeddings.json "s3://$BUCKET/work/embeddings.json" --quiet || true

      # Which photo URLs still work (agencies delete a let listing's photos while our
      # embeddings live on). Cached across runs; see scraper/photo_health.py.
      - name: Pull photo health cache
        run: |
          mkdir -p analytics
          aws s3 cp "s3://$BUCKET/analytics/photo-health.json" analytics/photo-health.json || echo "no photo health cache yet"

      - name: Build compact site embeddings
        run: |
          if [ -f work/embeddings.json ]; then
            python -m scraper.export_embeddings --embeddings work/embeddings.json --listings frontend/public/data/listings.json --out-dir frontend/public/data --photo-health analytics/photo-health.json
            aws s3 cp analytics/photo-health.json "s3://$BUCKET/analytics/photo-health.json" --quiet || true
          else
            echo "no work/embeddings.json — site will have no style data"
          fi

      - name: Geocode any new postcode areas
        if: env.DO_SCRAPE == 'true'
        run: python -m scraper.geocode_areas

      # where each listing is, for the draw-your-area filter (street lookups are cached and
      # time-budgeted, so coverage improves a little every day)
      - name: Locate listings
        if: env.DO_SCRAPE == 'true'
        run: |
          aws s3 cp "s3://$BUCKET/analytics/geocode-cache.json" analytics/geocode-cache.json || echo "no geocode cache yet"
          python -m scraper.listing_geo --max-minutes 15
          aws s3 cp analytics/geocode-cache.json "s3://$BUCKET/analytics/geocode-cache.json" || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # BucketDeployment uploads frontend/dist (which now contains the
      # refreshed data/) and invalidates CloudFront.
      - name: Deploy
        working-directory: infra
        run: |
          npm ci
          NODE_OPTIONS="--max-old-space-size=3000" TS_NODE_TRANSPILE_ONLY=true npx cdk deploy HousefinderFrontend --require-approval never

      # Only reached if everything above succeeded: the deployed data/ now
      # contains this run's work, so the checkpoint is obsolete (and would
      # otherwise overlay newer data next time).
      - name: Clear checkpoint
        if: env.DO_SCRAPE == 'true'
        run: aws s3 rm "s3://$BUCKET/cache/" --recursive

      # Last, and always (even after a failure): turn problems into alerts that the
      # host-side watcher hands to Claude (ops/housefinder_watch.py), and record a
      # heartbeat for good scraping runs so a missing run is noticed too.
      - name: Health report and alerts
        if: always()
        continue-on-error: true
        run: |
          mkdir -p alerts analytics
          aws s3 cp "s3://$BUCKET/analytics/health.json" analytics/health.json || true
          python3 -m scraper.health --history analytics/history.json --listings frontend/public/data/listings.json \
            --health analytics/health.json --job-status "${{ job.status }}" --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --event "${{ github.event_name }}" --scraped "$DO_SCRAPE" --out-dir alerts --heartbeat analytics/last-scrape.json
          aws s3 cp alerts/ "s3://$BUCKET/alerts/pending/" --recursive --quiet || true
          aws s3 cp analytics/health.json "s3://$BUCKET/analytics/health.json" --quiet || true
          [ -f analytics/last-scrape.json ] && aws s3 cp analytics/last-scrape.json "s3://$BUCKET/analytics/last-scrape.json" --quiet || true
