name: Deploy check (temporary diagnostic)

on:
  push:
    branches: [main]
    paths: [".github/workflows/deploy-check.yml"]

# Deliberately a different group from the main workflow so it isn't queued
# behind a multi-hour refresh run.
concurrency:
  group: deploy-check

permissions:
  id-token: write
  contents: read

env:
  BUCKET: housefinder-frontend-854656252703

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::854656252703:role/housefinder-github-deploy
          aws-region: us-east-1
      - run: |
          mkdir -p frontend/public/data
          aws s3 cp "s3://$BUCKET/data/" frontend/public/data/ --recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cd frontend && npm ci && npm run build
      - name: Deploy (capture output)
        working-directory: infra
        run: |
          npm ci
          set +e
          NODE_OPTIONS="--max-old-space-size=3000" TS_NODE_TRANSPILE_ONLY=true npx cdk deploy HousefinderFrontend --require-approval never > /tmp/deploy.log 2>&1
          code=$?
          grep -v -E "npm notice|^$" /tmp/deploy.log | tail -12 | while IFS= read -r line; do echo "::warning title=cdk::${line:0:400}"; done
          exit $code
